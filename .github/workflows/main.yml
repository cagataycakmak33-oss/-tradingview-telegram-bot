name: Ticaret Botu Çalışır

on:
  schedule:
    # Sabah: Türkiye saatiyle 09:55
    - cron: "55 9 * * 1-5"
      timezone: "Europe/Istanbul"

    # Öğleden sonra: Türkiye saatiyle 14:00
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    timeout-minutes: 260

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:

      # ==========================================================
      # REPOYU AL
      # ==========================================================

      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # GEREKLİ PAKETLER
      # ==========================================================

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================================
      # 5 DAKİKALIK TİCARET BOTU
      # ==========================================================

      - name: Botu 5 dakikada bir calistir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "=========================================="

          echo "GitHub event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

          # ========================================================
          # TÜRKİYE SAATİ
          # ========================================================

          START_HOUR=$(TZ=Europe/Istanbul date +%H)
          START_MINUTE=$(TZ=Europe/Istanbul date +%M)

          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))

          echo "Workflow baslangic saati: ${START_HOUR}:${START_MINUTE}"
          echo "Workflow baslangic dakikasi: ${START_TOTAL}"

          # ========================================================
          # HAFTA SONU KORUMASI
          # ========================================================

          DAY_OF_WEEK=$(TZ=Europe/Istanbul date +%u)

          echo "Haftanin gunu: ${DAY_OF_WEEK}"

          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo ""
            echo "=========================================="
            echo "HAFTA SONU"
            echo "=========================================="
            echo "Bot calistirilmayacak."
            exit 0
          fi

          # ========================================================
          # 18:00 SONRASI KORUMA
          # ========================================================

          if [ "$START_TOTAL" -gt 1080 ]; then
            echo ""
            echo "=========================================="
            echo "TARAMA SAATI DISINDA"
            echo "=========================================="
            echo "Türkiye saati: ${START_HOUR}:${START_MINUTE}"
            echo "18:00 sonrasi oldugu icin tarama yapilmayacak."
            exit 0
          fi

          # ========================================================
          # SABAH WORKFLOW'U
          #
          # 09:55 - 14:00
          #
          # Tarama saatleri:
          # 09:55
          # 10:00
          # 10:05
          # ...
          # 13:55
          #
          # 14:00'da sabah workflow'u kapanir.
          # 14:00 taramasini OGLEDEN SONRA workflow'u yapar.
          # Böylece 14:00 iki kere taranmaz.
          # ========================================================

          if [ "$START_TOTAL" -lt 840 ]; then

            echo ""
            echo "=========================================="
            echo "SABAH TARAMA MODU"
            echo "09:55 - 14:00"
            echo "=========================================="

            while true; do

              HOUR=$(TZ=Europe/Istanbul date +%H)
              MINUTE=$(TZ=Europe/Istanbul date +%M)
              SECOND=$(TZ=Europe/Istanbul date +%S)

              TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

              echo ""
              echo "Türkiye saati: ${HOUR}:${MINUTE}:${SECOND}"

              # ----------------------------------------------------
              # 09:55'ten önceyse bekle
              # ----------------------------------------------------

              if [ "$TOTAL_MINUTES" -lt 595 ]; then
                echo "09:55 bekleniyor..."
                sleep 30
                continue
              fi

              # ----------------------------------------------------
              # 14:00 geldiyse sabah workflow'u kapanir.
              # ----------------------------------------------------

              if [ "$TOTAL_MINUTES" -ge 840 ]; then

                echo ""
                echo "=========================================="
                echo "14:00 OLDU"
                echo "SABAH TARAMA MODU TAMAMLANDI"
                echo "=========================================="

                break
              fi

              # ----------------------------------------------------
              # TARAMA
              # ----------------------------------------------------

              echo ""
              echo "------------------------------------------"
              echo "Yeni sabah taramasi: ${HOUR}:${MINUTE}"
              echo "------------------------------------------"

              SCAN_START=$(date +%s)

              python main.py

              SCAN_END=$(date +%s)
              ELAPSED=$((SCAN_END - SCAN_START))

              echo ""
              echo "Tarama suresi: ${ELAPSED} saniye"

              # ----------------------------------------------------
              # TARAMA SONRASI SAAT KONTROLÜ
              # ----------------------------------------------------

              CURRENT_HOUR=$(TZ=Europe/Istanbul date +%H)
              CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
              CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

              CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

              if [ "$CURRENT_TOTAL" -ge 840 ]; then

                echo ""
                echo "14:00 sinirina ulasildi."
                echo "Sabah workflow'u kapatiliyor."

                break
              fi

              # ----------------------------------------------------
              # BİR SONRAKİ 5 DAKİKAYA HİZALAN
              # ----------------------------------------------------

              CURRENT_MINUTE_NUM=$((10#$CURRENT_MINUTE))
              CURRENT_SECOND_NUM=$((10#$CURRENT_SECOND))

              NEXT_WAIT=$((5 - (CURRENT_MINUTE_NUM % 5)))

              if [ "$NEXT_WAIT" -eq 5 ]; then
                NEXT_WAIT=0
              fi

              WAIT_SECONDS=$((NEXT_WAIT * 60 - CURRENT_SECOND_NUM))

              if [ "$WAIT_SECONDS" -le 0 ]; then
                WAIT_SECONDS=5
              fi

              echo ""
              echo "Bir sonraki sabah taramasi icin ${WAIT_SECONDS} saniye bekleniyor..."

              sleep "$WAIT_SECONDS"

            done

          fi

          # ========================================================
          # ÖĞLEDEN SONRA WORKFLOW'U
          #
          # 14:00 - 18:00
          #
          # Tarama saatleri:
          # 14:00
          # 14:05
          # 14:10
          # ...
          # 17:55
          # 18:00  <-- KESİN SON TARAMA
          # ========================================================

          CURRENT_HOUR=$(TZ=Europe/Istanbul date +%H)
          CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)

          CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

          if [ "$CURRENT_TOTAL" -ge 840 ] && [ "$CURRENT_TOTAL" -le 1080 ]; then

            echo ""
            echo "=========================================="
            echo "OGLEDEN SONRA TARAMA MODU"
            echo "14:00 - 18:00"
            echo "=========================================="

            while true; do

              HOUR=$(TZ=Europe/Istanbul date +%H)
              MINUTE=$(TZ=Europe/Istanbul date +%M)
              SECOND=$(TZ=Europe/Istanbul date +%S)

              TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

              echo ""
              echo "Türkiye saati: ${HOUR}:${MINUTE}:${SECOND}"

              # ----------------------------------------------------
              # 14:00'dan önceyse bekle
              # ----------------------------------------------------

              if [ "$TOTAL_MINUTES" -lt 840 ]; then
                echo "14:00 bekleniyor..."
                sleep 30
                continue
              fi

              # ----------------------------------------------------
              # 18:00'dan SONRA geldiyse cik.
              #
              # Dikkat:
              # 18:00 tam olarak GELDİĞİNDE burada çıkmıyoruz.
              # Önce python main.py çalışacak.
              # ----------------------------------------------------

              if [ "$TOTAL_MINUTES" -gt 1080 ]; then

                echo ""
                echo "=========================================="
                echo "18:00 GECTI"
                echo "OGLEDEN SONRA TARAMA TAMAMLANDI"
                echo "=========================================="

                break
              fi

              # ----------------------------------------------------
              # TARAMA
              #
              # 14:00
              # 14:05
              # 14:10
              # ...
              # 17:55
              # 18:00
              # ----------------------------------------------------

              echo ""
              echo "------------------------------------------"
              echo "Yeni ogleden sonra taramasi: ${HOUR}:${MINUTE}"
              echo "------------------------------------------"

              SCAN_START=$(date +%s)

              python main.py

              SCAN_END=$(date +%s)
              ELAPSED=$((SCAN_END - SCAN_START))

              echo ""
              echo "Tarama suresi: ${ELAPSED} saniye"

              # ----------------------------------------------------
              # TARAMA SONRASI SAAT
              # ----------------------------------------------------

              CURRENT_HOUR=$(TZ=Europe/Istanbul date +%H)
              CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)

              CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

              # ----------------------------------------------------
              # 18:00 TARAMASI TAMAMLANDIYSA BİTİR
              # ----------------------------------------------------

              if [ "$CURRENT_TOTAL" -ge 1080 ]; then

                echo ""
                echo "=========================================="
                echo "18:00 TARAMASI TAMAMLANDI"
                echo "BUGUNKU TARAMA TAMAMLANDI"
                echo "=========================================="

                break
              fi

              # ----------------------------------------------------
              # BİR SONRAKİ 5 DAKİKAYA HİZALAN
              # ----------------------------------------------------

              CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

              CURRENT_MINUTE_NUM=$((10#$CURRENT_MINUTE))
              CURRENT_SECOND_NUM=$((10#$CURRENT_SECOND))

              NEXT_WAIT=$((5 - (CURRENT_MINUTE_NUM % 5)))

              if [ "$NEXT_WAIT" -eq 5 ]; then
                NEXT_WAIT=0
              fi

              WAIT_SECONDS=$((NEXT_WAIT * 60 - CURRENT_SECOND_NUM))

              if [ "$WAIT_SECONDS" -le 0 ]; then
                WAIT_SECONDS=5
              fi

              echo ""
              echo "Bir sonraki ogleden sonra taramasi icin ${WAIT_SECONDS} saniye bekleniyor..."

              sleep "$WAIT_SECONDS"

            done

          fi

          # ========================================================
          # GÜNÜN SONU
          # ========================================================

          echo ""
          echo "=========================================="
          echo "TARAMA DONGUSU TAMAMLANDI"
          echo "=========================================="

      # ==========================================================
      # GÖNDERİLEN HİSSELERİ KAYDET
      # ==========================================================

      - name: Gonderilen hisseleri kaydet
        shell: bash
        run: |
          if [ -f gonderilen_hisseler.txt ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gonderilen_hisseler.txt

            if git diff --cached --quiet; then
              echo "Yeni gonderilen hisse kaydi yok."
            else
              git commit -m "Günlük gonderilen hisseleri guncelle"
              git push
            fi

          else

            echo "gonderilen_hisseler.txt bulunamadi."

          fi
