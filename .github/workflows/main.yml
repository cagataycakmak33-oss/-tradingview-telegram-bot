name: Trading Bot Calistir

on:
  # Sabah 09:50'de bir kez başlat
  schedule:
    - cron: "50 9 * * 1-5"
      timezone: "Europe/Istanbul"

  # Elle çalıştırma seçeneği
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yukle
        run: |
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        run: |
          set -e

          echo "===================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "===================================="

          while true; do

            SAAT_NUM=$(TZ=Europe/Istanbul date +%H)
            DAKIKA_NUM=$(TZ=Europe/Istanbul date +%M)

            TOPLAM_DAKIKA=$((10#$SAAT_NUM * 60 + 10#$DAKIKA_NUM))

            echo ""
            echo "Türkiye saati: ${SAAT_NUM}:${DAKIKA_NUM}"

            # 09:50'den önceyse bekle
            if [ "$TOPLAM_DAKIKA" -lt 590 ]; then
              KALAN=$((590 - TOPLAM_DAKIKA))
              echo "09:50 bekleniyor..."
              echo "${KALAN} dakika bekleniyor."
              sleep 60
              continue
            fi

            # 18:00 veya sonrasıysa bitir
            if [ "$TOPLAM_DAKIKA" -ge 1080 ]; then
              echo "18:00 oldu. Bugünkü tarama tamamlandı."
              break
            fi

            echo ""
            echo "===================================="
            echo "Yeni tarama: ${SAAT_NUM}:${DAKIKA_NUM}"
            echo "===================================="

            BASLANGIC=$(date +%s)

            python main.py

            BITIS=$(date +%s)
            GECEN=$((BITIS - BASLANGIC))

            echo ""
            echo "Tarama süresi: ${GECEN} saniye"

            # Bir sonraki 5 dakikalık zamana kadar bekle
            SIMDI_DAKIKA=$((10#$DAKIKA_NUM))
            SONRAKI_DAKIKA=$((5 - SIMDI_DAKIKA % 5))

            if [ "$SONRAKI_DAKIKA" -eq 5 ]; then
              SONRAKI_DAKIKA=0
            fi

            BEKLEME=$((SONRAKI_DAKIKA * 60 - GECEN))

            if [ "$BEKLEME" -gt 0 ]; then
              echo "Bir sonraki 5 dakikalık taramaya kadar ${BEKLEME} saniye bekleniyor..."
              sleep "$BEKLEME"
            else
              echo "Tarama uzun sürdü. Yeni tarama hemen başlıyor."
            fi

          done

          echo ""
          echo "===================================="
          echo "TARAMA DONGUSU TAMAMLANDI"
          echo "===================================="

      - name: Gonderilen hisseleri kaydet
        run: |
          if [ -f gonderilen_hisseler.txt ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gonderilen_hisseler.txt

            if git diff --cached --quiet; then
              echo "Yeni gönderilen hisse yok."
            else
              git commit -m "Günlük gönderilen hisseleri güncelle"
              git push
            fi

          else
            echo "gonderilen_hisseler.txt bulunamadı."
          fi
