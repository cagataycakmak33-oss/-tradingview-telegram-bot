name: Ticaret Botu Calistir

on:
workflow_dispatch:

schedule:
# Türkiye saati 09:45 civarında workflow başlatılır.
# Python 09:50'yi bekler.
- cron: "45 6 * * 1-5"

```
# Türkiye saati 14:00
- cron: "0 11 * * 1-5"
```

permissions:
contents: write

concurrency:
group: ticaret-botu-${{ github.ref }}
cancel-in-progress: false

jobs:

trading-bot:

```
runs-on: ubuntu-latest

timeout-minutes: 290

steps:

  # ============================================================
  # KODU AL
  # ============================================================

  - name: Kodu al
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  # ============================================================
  # PYTHON
  # ============================================================

  - name: Python 3.11 kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # ============================================================
  # GEREKSINIMLER
  # ============================================================

  - name: Gereksinimleri kur
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # ============================================================
  # SAAT KONTROLU
  # ============================================================

  - name: Saat kontrolu
    run: |
      echo "===================================="
      echo "GitHub UTC:"
      date -u
      echo ""
      echo "Turkiye saati:"
      TZ=Europe/Istanbul date
      echo "===================================="

  # ============================================================
  # BOT
  # ============================================================

  - name: Botu calistir
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    run: |

      set -e

      # ========================================================
      # AYARLAR
      # ========================================================

      INTERVAL=300

      # 09:50
      MORNING_START=590

      # 14:00
      AFTERNOON_START=840

      # 18:00
      END_TIME=1080

      echo ""
      echo "===================================="
      echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
      echo "===================================="
      echo "Sabah      : 09:50 - 14:00"
      echo "Ogleden sonra: 14:00 - 18:00"
      echo "Tarama     : 5 dakika"
      echo "Aylik MACD : Ilk taramada"
      echo "===================================="

      # ========================================================
      # BASLANGIC SAATI
      # ========================================================

      START_HOUR=$(TZ=Europe/Istanbul date +%H)
      START_MINUTE=$(TZ=Europe/Istanbul date +%M)

      START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))

      echo ""
      echo "Workflow baslangic saati: ${START_HOUR}:${START_MINUTE}"

      # ========================================================
      # MOD BELIRLE
      # ========================================================

      if [ "$START_TOTAL" -lt "$AFTERNOON_START" ]; then

        MODE="SABAH"

        echo ""
        echo "===================================="
        echo "SABAH MODU"
        echo "09:50 - 14:00"
        echo "===================================="

      else

        MODE="OGLE"

        echo ""
        echo "===================================="
        echo "OGLEDEN SONRA MODU"
        echo "14:00 - 18:00"
        echo "===================================="

      fi

      FIRST_RUN=true

      # ========================================================
      # ANA DONGU
      # ========================================================

      while true; do

        HOUR=$(TZ=Europe/Istanbul date +%H)
        MINUTE=$(TZ=Europe/Istanbul date +%M)

        TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

        echo ""
        echo "===================================="
        echo "Turkiye saati : ${HOUR}:${MINUTE}"
        echo "Mod           : $MODE"
        echo "===================================="

        # ======================================================
        # SABAH MODU
        # ======================================================

        if [ "$MODE" = "SABAH" ]; then

          # 09:50'den onceyse bekle
          if [ "$TOTAL_MINUTES" -lt "$MORNING_START" ]; then

            echo "09:50 bekleniyor..."

            sleep 30

            continue

          fi

          # 14:00 olduysa sabah workflow'u bitir
          if [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then

            echo ""
            echo "14:00 oldu."
            echo "Sabah workflow'u kapatiliyor."

            break

          fi

        fi

        # ======================================================
        # OGLEDEN SONRA MODU
        # ======================================================

        if [ "$MODE" = "OGLE" ]; then

          # 14:00'ten onceyse bekle
          if [ "$TOTAL_MINUTES" -lt "$AFTERNOON_START" ]; then

            echo "14:00 bekleniyor..."

            sleep 30

            continue

          fi

          # 18:00 olduysa bitir
          if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then

            echo ""
            echo "18:00 oldu."
            echo "Ogleden sonra workflow'u kapatiliyor."

            break

          fi

        fi

        # ======================================================
        # ILK TARAMA
        # ======================================================

        if [ "$FIRST_RUN" = "true" ]; then

          echo ""
          echo "===================================="
          echo "ILK TARAMA"
          echo "GUNLUK + AYLIK MACD"
          echo "===================================="

          AYLIK_TARAMA=true python main.py

          FIRST_RUN=false

        else

          echo ""
          echo "===================================="
          echo "NORMAL TARAMA"
          echo "SADECE GUNLUK"
          echo "===================================="

          AYLIK_TARAMA=false python main.py

        fi

        # ======================================================
        # TARAMA SONRASI SAAT KONTROLU
        # ======================================================

        HOUR=$(TZ=Europe/Istanbul date +%H)
        MINUTE=$(TZ=Europe/Istanbul date +%M)

        TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

        # Sabah workflow'u 14:00'te bitir
        if [ "$MODE" = "SABAH" ] && [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then

          echo ""
          echo "14:00 donemi geldi."
          echo "Sabah workflow'u sonlandiriliyor."

          break

        fi

        # Her iki modda da 18:00 kontrolu
        if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then

          echo ""
          echo "18:00 oldu."
          echo "Tarama workflow'u kapatiliyor."

          break

        fi

        # ======================================================
        # 5 DAKIKALIK BEKLEME
        # ======================================================

        CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
        CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

        REMAINDER=$((10#$CURRENT_MINUTE % 5))

        WAIT_MINUTES=$((5 - REMAINDER))

        if [ "$WAIT_MINUTES" -eq 5 ]; then
          WAIT_MINUTES=0
        fi

        WAIT_SECONDS=$((WAIT_MINUTES * 60 - 10#$CURRENT_SECOND))

        if [ "$WAIT_SECONDS" -le 0 ]; then
          WAIT_SECONDS=5
        fi

        echo ""
        echo "Bir sonraki tarama icin $WAIT_SECONDS saniye bekleniyor..."

        sleep "$WAIT_SECONDS"

      done

      echo ""
      echo "===================================="
      echo "TARAMA DONGUSU TAMAMLANDI"
      echo "===================================="

  # ============================================================
  # KAYIT DOSYALARINI GITHUB'A KAYDET
  # ============================================================

  - name: Kayit dosyalarini kaydet
    if: always()
    run: |

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add gonderilen_hisseler.txt || true
      git add gonderilen_aylik_hisseler.txt || true

      if git diff --cached --quiet; then

        echo "Kaydedilecek degisiklik yok."

      else

        git commit -m "Bot gonderim kayitlarini guncelle"

        git push

      fi
```
