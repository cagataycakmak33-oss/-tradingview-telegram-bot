name: Trading Bot Calistir

on:
  schedule:
    # Sabah: Türkiye saatiyle 09:50
    - cron: "50 9 * * 1-5"
      timezone: "Europe/Istanbul"

    # Öğleden sonra: Türkiye saatiyle 14:00
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

# Sabah ve öğleden sonra çalışmaları birbirini bekletmesin.
# Manuel çalıştırmalar da ayrı bir grup kullanır.
concurrency:
  group: trading-bot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        run: |
          set -e

          MORNING_START=590
          AFTERNOON_START=840
          END_TIME=1085

          START_HOUR=$(TZ=Europe/Istanbul date +%H)
          START_MINUTE=$(TZ=Europe/Istanbul date +%M)
          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))

          echo "========================================"
          echo "Workflow baslangic: ${START_HOUR}:${START_MINUTE}"
          echo "GitHub event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "========================================"

          # ========================================================
          # HANGİ MODDA ÇALIŞACAĞINI BELİRLE
          # ========================================================

          if [ "${{ github.event_name }}" = "schedule" ]; then

            if [ "${{ github.event.schedule }}" = "50 9 * * 1-5" ]; then
              MODE="SABAH"
              echo "SABAH MODU: 09:50 - 14:00"

            elif [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
              MODE="OGLE"
              echo "OGLE MODU: 14:00 - 18:05"

            else
              echo "Bilinmeyen schedule."
              echo "Workflow sonlandiriliyor."
              exit 0
            fi

          else
            # Manuel calistirmada mevcut Turkiye saatine gore karar ver.
            if [ "$START_TOTAL" -lt "$AFTERNOON_START" ]; then
              MODE="SABAH"
              echo "MANUEL CALISTIRMA -> SABAH MODU"
              echo "09:50 - 14:00"

            elif [ "$START_TOTAL" -lt "$END_TIME" ]; then
              MODE="OGLE"
              echo "MANUEL CALISTIRMA -> OGLE MODU"
              echo "14:00 - 18:05"

            else
              echo "Manuel calistirma saat disinda."
              echo "Tarama yapilmayacak."
              exit 0
            fi
          fi

          FIRST_RUN=true

          while true; do

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)
            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            echo ""
            echo "========================================"
            echo "Turkiye saati: ${HOUR}:${MINUTE}"
            echo "Mod: ${MODE}"
            echo "========================================"

            # ======================================================
            # SABAH
            # ======================================================

            if [ "$MODE" = "SABAH" ]; then

              if [ "$TOTAL_MINUTES" -lt "$MORNING_START" ]; then
                echo "09:50 bekleniyor..."
                sleep 30
                continue
              fi

              if [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
                echo "14:00 oldu. Sabah workflow'u bitiyor."
                break
              fi

            # ======================================================
            # OGLEDEN SONRA
            # ======================================================

            else

              if [ "$TOTAL_MINUTES" -lt "$AFTERNOON_START" ]; then
                echo "14:00 bekleniyor..."
                sleep 30
                continue
              fi

              if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
                echo "18:05 oldu. Ogleden sonra workflow'u bitiyor."
                break
              fi

            fi

            # ======================================================
            # TARAMA
            # ======================================================

            BASLANGIC=$(date +%s)

            if [ "$FIRST_RUN" = "true" ]; then

              echo "ILK TARAMA: GUNLUK + AYLIK MACD"

              AYLIK_TARAMA=true python main.py

              FIRST_RUN=false

            else

              echo "NORMAL TARAMA: SADECE GUNLUK"

              AYLIK_TARAMA=false python main.py

            fi

            BITIS=$(date +%s)
            GECEN=$((BITIS - BASLANGIC))

            echo "Tarama suresi: ${GECEN} saniye"

            # ======================================================
            # TARAMA SONRASI SAAT KONTROLU
            # ======================================================

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)
            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            if [ "$MODE" = "SABAH" ] && [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
              echo "14:00 oldu. Sabah workflow'u kapatiliyor."
              break
            fi

            if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
              echo "18:05 oldu. Workflow kapatiliyor."
              break
            fi

            # ======================================================
            # BIR SONRAKI 5 DAKIKALIK NOKTAYA BEKLE
            # ======================================================

            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            CURRENT_MINUTE_NUM=$((10#$CURRENT_MINUTE))
            CURRENT_SECOND_NUM=$((10#$CURRENT_SECOND))

            NEXT_WAIT=$((5 - (CURRENT_MINUTE_NUM % 5)))

            if [ "$NEXT_WAIT" -eq 5 ]; then
              NEXT_WAIT=0
            fi

            WAIT_SECONDS=$((NEXT_WAIT * 60 - CURRENT_SECOND_NUM))

            if [ "$WAIT_SECONDS" -le 0 ]; then
              WAIT_SECONDS=5
            fi

            echo "Sonraki tarama icin ${WAIT_SECONDS} saniye bekleniyor..."

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "========================================"
          echo "TARAMA DONGUSU TAMAMLANDI"
          echo "========================================"

      - name: Gonderilen hisseleri kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt || true
          git add gonderilen_aylik_hisseler.txt || true

          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
          else
            git commit -m "Bot gonderim kayitlarini guncelle"
            git push
          fi
```
