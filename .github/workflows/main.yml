name: Ticaret Botu Çalışır

on:
  # Harici servislerin (Örn: cron-job.org) tetiklemesi için webhook desteği
  repository_dispatch:
    types: [trigger-morning, trigger-afternoon]
  
  # Manuel çalıştırma düğmesi (Gerektiğinde elle başlatmak için)
  workflow_dispatch:
    inputs:
      session_mode:
        description: 'Çalıştırma Modu Seçin'
        required: true
        default: 'morning'
        type: choice
        options:
        - morning
        - afternoon

permissions:
  contents: write

# Aynı anda iki bot oturumu çalışmasın.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "=========================================="

          export TZ="Europe/Istanbul"
          DAY_OF_WEEK=$(date +%u)

          echo "Haftanin gunu: $DAY_OF_WEEK"

          # Hafta sonu çalışmasını engelle (1=Pazartesi, 5=Cuma)
          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot calistirilmayacak."
            exit 0
          fi

          # Mod tespiti: Dışarıdan gelen webhook event tipine veya manuel seçime göre belirlenir
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "trigger-morning" ]; then
              MODE="morning"
            else
              MODE="afternoon"
            fi
          else
            # Eğer manuel (workflow_dispatch) çalıştırıldıysa input'u oku
            MODE="${{ github.event.inputs.session_mode }}"
          fi

          # Bitiş saat limitlerini tanımlıyoruz
          if [ "$MODE" = "morning" ]; then
            END_TOTAL=840 # 14:00 (14 * 60)
            echo "SABAH TARAMA MODU AKTİF (14:00'e kadar çalışacak)"
          else
            END_TOTAL=1080 # 18:00 (18 * 60)
            echo "ÖĞLEDEN SONRA TARAMA MODU AKTİF (18:00'e kadar çalışacak)"
          fi

          while true; do
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$(date +%M)
            NOW_SECOND=$(date +%S)
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + 10#$NOW_MINUTE))

            # Oturum bitiş kontrolü
            if [ "$NOW_TOTAL" -ge "$END_TOTAL" ]; then
              echo "Oturum bitiş saatine ($((END_TOTAL / 60)):00) ulaşıldı. Kapatılıyor."
              break
            fi

            echo ""
            echo "=========================================="
            echo "Tarama baslangici: ${NOW_HOUR}:${NOW_MINUTE}:${NOW_SECOND}"
            echo "=========================================="

            SCAN_START=$(date +%s)
            python main.py
            SCAN_END=$(date +%s)

            echo "Tarama suresi: $((SCAN_END - SCAN_START)) saniye"

            # Döngü içi anlık zaman kontrolü
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$((10#$(date +%M)))
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + NOW_MINUTE))

            if [ "$NOW_TOTAL" -ge "$END_TOTAL" ]; then
              echo "Seans sonunda bitiş saatine ulaşıldı."
              break
            fi

            # Sonraki tam 5. dakikaya kadar hassas bekleme yap (Örn: 10:05, 10:10)
            CURRENT_EPOCH=$(date +%s)
            NEXT_EPOCH=$(( (CURRENT_EPOCH / 300 + 1) * 300 ))
            WAIT_SECONDS=$((NEXT_EPOCH - CURRENT_EPOCH))

            echo "Bir sonraki tarama seansi icin ${WAIT_SECONDS} saniye bekleniyor..."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "OTURUM TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "=========================================="

      - name: Gonderilen hisseleri kaydet
        if: always()
        shell: bash
        run: |
          if [ ! -f gonderilen_hisseler.txt ]; then
            echo "Gonderilen hisse dosyasi bulunamadi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt

          if git diff --cached --quiet; then
            echo "Yeni gonderilen hisse kaydi yok."
          else
            git commit -m "Gunluk gonderilen hisseleri guncelle"
            git push
          fi

