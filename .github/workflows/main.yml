name: Trading Bot Calistir

on:
  schedule:
    - cron: "50,55 9 * * 1-5"
      timezone: "Europe/Istanbul"

    - cron: "*/5 10-17 * * 1-5"
      timezone: "Europe/Istanbul"

    - cron: "0,5 18 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # =================================================
      # KODU İNDİR
      # =================================================

      - name: Kodu indir
        uses: actions/checkout@v4

      # =================================================
      # PYTHON
      # =================================================

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =================================================
      # PAKETLER
      # =================================================

      - name: Paketleri yukle
        run: |
          pip install -r requirements.txt

      # =================================================
      # BOT
      # =================================================

      - name: Botu calistir
        run: |
          python main.py

      # =================================================
      # GÖNDERİLEN HİSSELERİ GITHUB'A KAYDET
      # =================================================

      - name: Gonderilen hisseleri kaydet
        run: |

          if git diff --quiet -- gonderilen_hisseler.txt; then
            echo "Yeni gönderilen hisse yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt

          git commit -m "Günlük gönderilen hisseleri güncelle"

          git push
