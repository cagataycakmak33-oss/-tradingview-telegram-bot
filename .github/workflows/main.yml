
name: Ticaret Botu Çalışır

on:
  schedule:
    # Türkiye saati 09:50 (UTC 06:50)
    - cron: '50 6 * * 1-5'
    # Türkiye saati 14:00 (UTC 11:00)
    - cron: '0 11 * * 1-5'

  workflow_dispatch:
    inputs:
      session_mode:
        description: 'Manuel çalıştırma modu'
        required: true
        default: morning
        type: choice
        options:
          - morning
          - afternoon

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir çalıştır
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.session_mode || 'morning' }}

        run: |
          set -euo pipefail
          export TZ="Europe/Istanbul"

          MORNING_START=590
          MORNING_END=840
          AFTERNOON_START=840
          AFTERNOON_END=1085

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU"
          echo "Türkiye saati: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Tetikleme: $EVENT_NAME"
          echo "Cron: $SCHEDULE_CRON"
          echo "=========================================="

          DAY_OF_WEEK=$(date +%u)

          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot çalıştırılmayacak."
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "50 6 * * 1-5")
                MODE="morning"
                ;;
              "0 11 * * 1-5")
                MODE="afternoon"
                ;;
              *)
                echo "Tanınmayan zamanlama: $SCHEDULE_CRON"
                exit 1
                ;;
            esac
          else
            MODE="$MANUAL_MODE"
          fi

          case "$MODE" in
            morning)
              START_TOTAL=$MORNING_START
              END_TOTAL=$MORNING_END
              echo "SABAH SEANSI: 09:50 - 14:00"
              echo "Hedef taramalar: 09:50, 09:55, ... 13:55"
              ;;
            afternoon)
              START_TOTAL=$AFTERNOON_START
              END_TOTAL=$AFTERNOON_END
              echo "ÖĞLEDEN SONRA SEANSI: 14:00 - 18:05"
              echo "Hedef taramalar: 14:00, 14:05, ... 18:05"
              ;;
            *)
              echo "Geçersiz seans: $MODE"
              exit 1
              ;;
          esac

          get_now_total() {
            local hour minute
            hour=$(date +%H)
            minute=$(date +%M)
            echo $((10#$hour * 60 + 10#$minute))
          }

          while [ "$(get_now_total)" -lt "$START_TOTAL" ]; do
            echo "Seans başlangıcı bekleniyor: $(date '+%H:%M:%S')"
            sleep 15
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          kayitlari_kaydet() {
            if [ ! -f gonderilen_hisseler.txt ]; then
              echo "Gönderilen hisse kayıt dosyası bulunamadı."
              return 0
            fi

            git add gonderilen_hisseler.txt

            if ! git diff --cached --quiet; then
              git commit -m "Günlük gönderilen hisseleri güncelle"
              git push
              echo "Günlük hisse kayıtları GitHub'a kaydedildi."
            else
              echo "Yeni kayıt yok."
            fi
          }

          SCAN_FAILURES=0
          LAST_SLOT=""

          while true; do
            NOW_TOTAL=$(get_now_total)

            if [ "$MODE" = "morning" ] &&
               [ "$NOW_TOTAL" -ge "$MORNING_END" ]; then
              echo "Sabah seansı sona erdi."
              break
            fi

            if [ "$MODE" = "afternoon" ] &&
               [ "$NOW_TOTAL" -gt "$AFTERNOON_END" ]; then
              echo "Öğleden sonra seansı sona erdi."
              break
            fi

            SLOT_MINUTE=$((10#$(date +%M)))
            SLOT_MINUTE=$((SLOT_MINUTE / 5 * 5))
            SLOT="$(date '+%Y-%m-%d %H'):$(printf '%02d' "$SLOT_MINUTE")"

            if [ "$SLOT" = "$LAST_SLOT" ]; then
              sleep 2
              continue
            fi

            LAST_SLOT="$SLOT"

            echo ""
            echo "=========================================="
            echo "Tarama başlangıcı: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "Seans: $MODE"
            echo "=========================================="

            SCAN_START=$(date +%s)

            if python main.py; then
              echo "Tarama başarıyla tamamlandı."
            else
              SCAN_EXIT=$?
              SCAN_FAILURES=$((SCAN_FAILURES + 1))
              echo "UYARI: main.py hata kodu $SCAN_EXIT ile sonlandı."
            fi

            kayitlari_kaydet

            SCAN_END=$(date +%s)
            echo "Tarama süresi: $((SCAN_END - SCAN_START)) saniye"

            CURRENT_EPOCH=$(date +%s)
            NEXT_EPOCH=$(( (CURRENT_EPOCH / 300 + 1) * 300 ))
            WAIT_SECONDS=$((NEXT_EPOCH - CURRENT_EPOCH))

            echo "Sonraki taramaya kadar $WAIT_SECONDS saniye beklenecek."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "OTURUM TAMAMLANDI"
          echo "Başarısız tarama sayısı: $SCAN_FAILURES"
          echo "=========================================="

      - name: Son kayıtları güvenceye al
        if: always()
        shell: bash
        run: |
          if [ ! -f gonderilen_hisseler.txt ]; then
            echo "Gönderilen hisse dosyası bulunamadı."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni kayıt yok."
          else
            git commit -m "Günlük gönderilen hisseleri güncelle"
            git push
          fi
