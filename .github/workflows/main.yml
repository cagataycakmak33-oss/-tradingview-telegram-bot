name: Ticaret Botu Calistir

on:
  workflow_dispatch:

  schedule:
    - cron: "50 6 * * 1-5"
    - cron: "0 11 * * 1-5"

jobs:

  trading-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 290

    concurrency:
      group: trading-bot
      cancel-in-progress: false

    steps:

      # ======================================================
      # KODU AL
      # ======================================================

      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # KÜTÜPHANELER
      # ======================================================

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # TÜRKİYE SAATİ
      # ======================================================

      - name: Saat kontrolu
        run: |
          echo "GitHub UTC:"
          date -u

          echo "Turkiye saati:"
          TZ=Europe/Istanbul date

      # ======================================================
      # BOT
      # ======================================================

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e

          INTERVAL=300

          MORNING_START="09:50"
          AFTERNOON_START="14:00"
          END_TIME="18:00"

          echo "=========================================="
          echo "🤖 BIST TELEGRAM BOTU"
          echo "=========================================="
          echo "Sabah: 09:50 - 14:00"
          echo "Öğleden sonra: 14:00 - 18:00"
          echo "Tarama aralığı: 5 dakika"
          echo "Aylık MACD: 09:50 ve 14:00"
          echo "=========================================="

          # ==================================================
          # İLK ÇALIŞMADA AYLIK MACD ÇALIŞSIN
          # ==================================================

          FIRST_RUN=true

          # ==================================================
          # SABAH / ÖĞLEDEN SONRA DÖNEMİNİ BELİRLE
          # ==================================================

          CURRENT_TIME=$(TZ=Europe/Istanbul date +"%H:%M")

          echo "🇹🇷 Türkiye saati: $CURRENT_TIME"

          if [ "$CURRENT_TIME" \< "$AFTERNOON_START" ]; then

            MODE="SABAH"

            echo "🟢 Sabah çalışma modu"

          else

            MODE="OGLE"

            echo "🔵 Öğleden sonra çalışma modu"

          fi

          # ==================================================
          # ANA DÖNGÜ
          # ==================================================

          while true
          do

            NOW=$(TZ=Europe/Istanbul date +"%H:%M")

            echo ""
            echo "=========================================="
            echo "🕐 Türkiye saati: $NOW"
            echo "📌 Mod: $MODE"
            echo "=========================================="

            # =================================================
            # SABAH DÖNEMİ
            # =================================================

            if [ "$MODE" = "SABAH" ]; then

              if [ "$NOW" \< "$MORNING_START" ]; then

                echo "⏳ 09:50 bekleniyor..."

                sleep 30

                continue

              fi

              if [ "$NOW" \> "$AFTERNOON_START" ] || [ "$NOW" = "$AFTERNOON_START" ]; then

                echo "🔵 14:00 dönemi başladı."

                MODE="OGLE"

                FIRST_RUN=true

                continue

              fi

            fi

            # =================================================
            # ÖĞLEDEN SONRA
            # =================================================

            if [ "$MODE" = "OGLE" ]; then

              if [ "$NOW" \< "$AFTERNOON_START" ]; then

                echo "⏳ 14:00 bekleniyor..."

                sleep 30

                continue

              fi

              if [ "$NOW" \> "$END_TIME" ] || [ "$NOW" = "$END_TIME" ]; then

                echo "18:00 oldu."
                echo "Öğleden sonra tarama durduruluyor."

                break

              fi

            fi

            # =================================================
            # SABAH 14:00 KONTROLÜ
            # =================================================

            if [ "$MODE" = "SABAH" ] && \
               { [ "$NOW" \> "$AFTERNOON_START" ] || [ "$NOW" = "$AFTERNOON_START" ]; }; then

              echo "14:00 oldu."
              echo "Sabah tarama dönemi kapatılıyor."

              MODE="OGLE"
              FIRST_RUN=true

              continue

            fi

            # =================================================
            # 18:00 KONTROLÜ
            # =================================================

            if [ "$NOW" \> "$END_TIME" ] || [ "$NOW" = "$END_TIME" ]; then

              echo "18:00 oldu."
              echo "Tarama döngüsü kapatılıyor."

              break

            fi

            # =================================================
            # TARAMA
            # =================================================

            if [ "$FIRST_RUN" = "true" ]; then

              echo ""
              echo "🔴 İLK TARAMA"
              echo "🔴 GÜNLÜK + AYLIK MACD"

              AYLIK_TARAMA=true python main.py

              FIRST_RUN=false

            else

              echo ""
              echo "🟢 NORMAL TARAMA"
              echo "🟢 SADECE GÜNLÜK"

              AYLIK_TARAMA=false python main.py

            fi

            # =================================================
            # TARAMA SONRASI SAAT KONTROLÜ
            # =================================================

            NOW=$(TZ=Europe/Istanbul date +"%H:%M")

            if [ "$MODE" = "SABAH" ] && \
               { [ "$NOW" \> "$AFTERNOON_START" ] || [ "$NOW" = "$AFTERNOON_START" ]; }; then

              echo ""
              echo "🔵 14:00 dönemi geldi."

              MODE="OGLE"
              FIRST_RUN=true

              continue

            fi

            if [ "$NOW" \> "$END_TIME" ] || [ "$NOW" = "$END_TIME" ]; then

              echo ""
              echo "18:00 oldu."
              echo "Tarama durduruluyor."

              break

            fi

            # =================================================
            # 5 DAKİKALIK BEKLEME
            # =================================================

            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +"%M")
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +"%S")

            REMAINDER=$((10#$CURRENT_MINUTE % 5))

            WAIT_MINUTES=$((5 - REMAINDER))

            if [ "$WAIT_MINUTES" -eq 5 ]; then
              WAIT_MINUTES=0
            fi

            WAIT_SECONDS=$((WAIT_MINUTES * 60 - 10#$CURRENT_SECOND))

            if [ "$WAIT_SECONDS" -le 0 ]; then
              WAIT_SECONDS=5
            fi

            echo ""
            echo "⏳ Bir sonraki tarama için $WAIT_SECONDS saniye bekleniyor..."

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "=========================================="
          echo "🏁 TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "=========================================="

      # ======================================================
      # KAYIT DOSYALARINI GITHUB'A KAYDET
      # ======================================================

      - name: Kayıt dosyalarını kaydet
        if: always()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt || true
          git add gonderilen_aylik_hisseler.txt || true

          if git diff --cached --quiet; then

            echo "Kaydedilecek değişiklik yok."

          else

            git commit -m "Bot gönderim kayıtlarını güncelle"

            git push

          fi
