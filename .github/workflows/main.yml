name: Ticaret Botu Çalışır

on:
  repository_dispatch:
    types: [trigger-morning, trigger-afternoon]

  workflow_dispatch:
    inputs:
      session_mode:
        description: 'Calistirma modu'
        required: true
        default: morning
        type: choice
        options:
          - morning
          - afternoon

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          MANUAL_MODE: ${{ inputs.session_mode || 'morning' }}
        run: |
          set -euo pipefail
          export TZ="Europe/Istanbul"

          MORNING_START=590
          AFTERNOON_START=840
          MORNING_END=840
          AFTERNOON_END=1085

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU"
          echo "Turkiye saati: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Tetikleme: $EVENT_NAME"
          echo "=========================================="

          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot calistirilmayacak."
            exit 0
          fi

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$EVENT_ACTION" in
              "trigger-morning") MODE="morning" ;;
              "trigger-afternoon") MODE="afternoon" ;;
              *) echo "Bilinmeyen webhook eylemi: $EVENT_ACTION"; exit 1 ;;
            esac
          else
            MODE="$MANUAL_MODE"
          fi

          case "$MODE" in
            morning)
              START_TOTAL=$MORNING_START
              END_TOTAL=$MORNING_END
              echo "SABAH SEANSI ONAYLANDI: 09:50 - 14:00"
              ;;
            afternoon)
              START_TOTAL=$AFTERNOON_START
              END_TOTAL=$AFTERNOON_END
              echo "OGLEDEN SONRA SEANSI ONAYLANDI: 14:00 - 18:05"
              ;;
            *)
              echo "Gecersiz seans: $MODE"
              exit 1
              ;;
          esac

          get_now_total() {
            echo $((10#$(date +%H) * 60 + 10#$(date +%M)))
          }

          NOW_TOTAL=$(get_now_total)

          if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge "$END_TOTAL" ]; then
            echo "Sabah seansi bittigi icin islem baslatilamaz."
            exit 0
          fi

          if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -gt "$END_TOTAL" ]; then
            echo "Ogleden sonra seansi bittigi icin islem baslatilamaz."
            exit 0
          fi

          SCAN_FAILURES=0

          while true; do
            NOW_TOTAL=$(get_now_total)

            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge "$END_TOTAL" ]; then
              echo "Saat 14:00 oldu. Sabah oturumu kapatiliyor."
              break
            fi

            if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -gt "$END_TOTAL" ]; then
              echo "Saat 18:05 oldu. Ogleden sonra oturumu kapatiliyor."
              break
            fi

            echo ""
            echo "=========================================="
            echo "Tarama baslangici: $(date '+%H:%M:%S')"
            echo "=========================================="

            SCAN_START=$(date +%s)

            if python main.py; then
              echo "Tarama basariyla tamamlandi."
            else
              SCAN_EXIT=$?
              SCAN_FAILURES=$((SCAN_FAILURES + 1))
              echo "UYARI: main.py hata kodu $SCAN_EXIT ile sonlandi."
            fi

            SCAN_END=$(date +%s)
            echo "Tarama suresi: $((SCAN_END - SCAN_START)) saniye"

            CURRENT_EPOCH=$(date +%s)
            NEXT_EPOCH=$(( (CURRENT_EPOCH / 300 + 1) * 300 ))
            WAIT_SECONDS=$((NEXT_EPOCH - CURRENT_EPOCH))

            echo "Sonraki tarama icin $WAIT_SECONDS saniye bekleniyor."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "OTURUM TAMAMLANDI"
          echo "=========================================="

      - name: Gonderilen hisseleri kaydet
        if: always()
        shell: bash
        run: |
          if [ ! -f gonderilen_hisseler.txt ]; then
            echo "Gonderilen hisse dosyasi bulunamadi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gonderilen_hisseler.txt
          if git diff --cached --quiet; then
            echo "Yeni gonderilen hisse kaydi yok."
          else
            git commit -m "Gunluk gonderilen hisseleri guncelle"
            git push
          fi
