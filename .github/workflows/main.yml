name: Trading Bot Calistir

on:
  schedule:
    - cron: "50 9 * * 1-5"
      timezone: "Europe/Istanbul"

    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yukle
        run: |
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        run: |
          set -e

          echo "===================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "===================================="

          while true; do

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)

            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            echo ""
            echo "Turkiye saati: ${HOUR}:${MINUTE}"

            # 09:50'den onceyse 09:50'yi bekle
            if [ "$TOTAL_MINUTES" -lt 590 ]; then
              echo "09:50 bekleniyor..."
              sleep 60
              continue
            fi

            # 18:00 veya sonrasiysa bitir
            if [ "$TOTAL_MINUTES" -ge 1080 ]; then
              echo "18:00 oldu. Bugunku tarama tamamlandi."
              break
            fi

            echo ""
            echo "===================================="
            echo "Yeni tarama: ${HOUR}:${MINUTE}"
            echo "===================================="

            BASLANGIC=$(date +%s)

            python main.py

            BITIS=$(date +%s)
            GECEN=$((BITIS - BASLANGIC))

            echo ""
            echo "Tarama suresi: ${GECEN} saniye"

            # Tarama bittikten sonraki mevcut dakika
            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            CURRENT_MINUTE_NUM=$((10#$CURRENT_MINUTE))
            CURRENT_SECOND_NUM=$((10#$CURRENT_SECOND))

            # Bir sonraki 5 dakikalik dakikayi bul
            NEXT_WAIT=$((5 - (CURRENT_MINUTE_NUM % 5)))

            if [ "$NEXT_WAIT" -eq 5 ]; then
              NEXT_WAIT=0
            fi

            WAIT_SECONDS=$((NEXT_WAIT * 60 - CURRENT_SECOND_NUM))

            # Eger zaten 5 dakikalik sinira cok yakinsa
            if [ "$WAIT_SECONDS" -le 0 ]; then
              WAIT_SECONDS=5
            fi

            echo "Bir sonraki tarama icin ${WAIT_SECONDS} saniye bekleniyor..."

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "===================================="
          echo "TARAMA DONGUSU TAMAMLANDI"
          echo "===================================="

      - name: Gonderilen hisseleri kaydet
        run: |
          if [ -f gonderilen_hisseler.txt ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gonderilen_hisseler.txt

            if git diff --cached --quiet; then
              echo "Yeni gonderilen hisse yok."
            else
              git commit -m "Gunluk gonderilen hisseleri guncelle"
              git push
            fi

          else
            echo "gonderilen_hisseler.txt bulunamadi."
          fi
