name: Ticaret Botu Calistir

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * 1-5"
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Saat kontrolu
        run: |
          echo "===================================="
          echo "GitHub UTC:"
          date -u
          echo ""
          echo "Turkiye saati:"
          TZ=Europe/Istanbul date
          echo "===================================="

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          MORNING_START=590
          AFTERNOON_START=840
          END_TIME=1080

          echo "===================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "===================================="

          START_HOUR=$(TZ=Europe/Istanbul date +%H)
          START_MINUTE=$(TZ=Europe/Istanbul date +%M)
          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))

          echo "Workflow baslangic: ${START_HOUR}:${START_MINUTE}"

          if [ "$START_TOTAL" -lt "$AFTERNOON_START" ]; then
            MODE="SABAH"
            echo "SABAH MODU: 09:50 - 14:00"
          else
            MODE="OGLE"
            echo "OGLE MODU: 14:00 - 18:00"
          fi

          FIRST_RUN=true

          while true; do

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)
            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            echo ""
            echo "Turkiye saati: ${HOUR}:${MINUTE}"
            echo "Mod: $MODE"

            if [ "$MODE" = "SABAH" ]; then

              if [ "$TOTAL_MINUTES" -lt "$MORNING_START" ]; then
                echo "09:50 bekleniyor..."
                sleep 30
                continue
              fi

              if [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
                echo "14:00 oldu. Sabah workflow'u bitiyor."
                break
              fi

            else

              if [ "$TOTAL_MINUTES" -lt "$AFTERNOON_START" ]; then
                echo "14:00 bekleniyor..."
                sleep 30
                continue
              fi

              if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
                echo "18:00 oldu. Workflow bitiyor."
                break
              fi

            fi

            if [ "$FIRST_RUN" = "true" ]; then

              echo "ILK TARAMA: GUNLUK + AYLIK MACD"

              AYLIK_TARAMA=true python main.py

              FIRST_RUN=false

            else

              echo "NORMAL TARAMA: SADECE GUNLUK"

              AYLIK_TARAMA=false python main.py

            fi

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)
            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            if [ "$MODE" = "SABAH" ] && [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
              echo "14:00 oldu. Sabah workflow'u kapatiliyor."
              break
            fi

            if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
              echo "18:00 oldu. Workflow kapatiliyor."
              break
            fi

            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            REMAINDER=$((10#$CURRENT_MINUTE % 5))
            WAIT_MINUTES=$((5 - REMAINDER))

            if [ "$WAIT_MINUTES" -eq 5 ]; then
              WAIT_MINUTES=0
            fi

            WAIT_SECONDS=$((WAIT_MINUTES * 60 - 10#$CURRENT_SECOND))

            if [ "$WAIT_SECONDS" -le 0 ]; then
              WAIT_SECONDS=5
            fi

            echo "Sonraki tarama icin $WAIT_SECONDS saniye bekleniyor..."

            sleep "$WAIT_SECONDS"

          done

          echo "TARAMA DONGUSU TAMAMLANDI"

      - name: Kayit dosyalarini kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt || true
          git add gonderilen_aylik_hisseler.txt || true

          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
          else
            git commit -m "Bot gonderim kayitlarini guncelle"
            git push
          fi
