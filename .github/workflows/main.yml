name: Ticaret Botu Calistir

on:
  schedule:
    # Sabah: Türkiye saatiyle 09:50
    - cron: "50 9 * * 1-5"
      timezone: "Europe/Istanbul"

    # Öğleden sonra: Türkiye saatiyle 14:00
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  # Manuel çalıştırma
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ============================================================
      # KODU İNDİR
      # ============================================================

      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # PAKETLER
      # ============================================================

      - name: Paketleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 5 DAKİKALIK TARAMA
      # ============================================================

      - name: Botu 5 dakikada bir calistir
        shell: bash
        run: |
          set -e

          MORNING_START=590
          AFTERNOON_START=840
          END_TIME=1085

          START_HOUR=$(TZ=Europe/Istanbul date +%H)
          START_MINUTE=$(TZ=Europe/Istanbul date +%M)
          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))

          DAY_OF_WEEK=$(TZ=Europe/Istanbul date +%u)

          echo "========================================"
          echo "İş akışı başlangıç: ${START_HOUR}:${START_MINUTE}"
          echo "GitHub etkinliği: ${{ github.event_name }}"
          echo "Program: ${{ github.event.schedule }}"
          echo "Haftanın günü: ${DAY_OF_WEEK}"
          echo "========================================"

          # ========================================================
          # HAFTA SONU KONTROLÜ
          # 1 = Pazartesi ... 5 = Cuma
          # 6 = Cumartesi, 7 = Pazar
          # ========================================================

          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot çalıştırılmayacak."
            exit 0
          fi

          # ========================================================
          # MOD BELİRLE
          # ========================================================

          if [ "${{ github.event_name }}" = "schedule" ]; then

            if [ "${{ github.event.schedule }}" = "50 9 * * 1-5" ]; then

              MODE="SABAH"

              echo "SABAH MODU: 09:50 - 14:00"

            elif [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then

              MODE="OGLE"

              echo "OGLE MODU: 14:00 - 18:05"

            else

              echo "Bilinmeyen zamanlama."
              echo "İş akışı sonlandırılıyor."
              exit 0

            fi

          else

            # ======================================================
            # MANUEL ÇALIŞTIRMA
            # ======================================================

            if [ "$START_TOTAL" -lt "$AFTERNOON_START" ]; then

              MODE="SABAH"

              echo "MANUEL ÇALIŞTIRMA -> SABAH MODU"
              echo "Çalışma aralığı: 09:50 - 14:00"

            elif [ "$START_TOTAL" -lt "$END_TIME" ]; then

              MODE="OGLE"

              echo "MANUEL ÇALIŞTIRMA -> OGLE MODU"
              echo "Çalışma aralığı: 14:00 - 18:05"

            else

              echo "Manuel çalıştırma zamanı çalışma aralığı dışında."
              echo "Tarama yapılmayacak."
              exit 0

            fi

          fi

          # ========================================================
          # İLK TARAMA
          # İlk taramada günlük + aylık MACD
          # ========================================================

          FIRST_RUN=true

          # ========================================================
          # ANA DÖNGÜ
          # ========================================================

          while true; do

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)

            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            echo ""
            echo "========================================"
            echo "Türkiye saati: ${HOUR}:${MINUTE}"
            echo "Mod: ${MODE}"
            echo "========================================"

            # ======================================================
            # SABAH MODU
            # ======================================================

            if [ "$MODE" = "SABAH" ]; then

              # 09:50'dan önceyse bekle
              if [ "$TOTAL_MINUTES" -lt "$MORNING_START" ]; then
                echo "09:50 bekleniyor..."
                sleep 30
                continue
              fi

              # 14:00 olduysa sabah workflow'u bitir
              if [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
                echo "14:00 oldu. Sabah iş akışı bitiriliyor."
                break
              fi

            # ======================================================
            # ÖĞLEDEN SONRA MODU
            # ======================================================

            else

              # 14:00'dan önceyse bekle
              if [ "$TOTAL_MINUTES" -lt "$AFTERNOON_START" ]; then
                echo "14:00 bekleniyor..."
                sleep 30
                continue
              fi

              # 18:05 olduysa workflow'u bitir
              if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
                echo "18:05 oldu. Öğleden sonra iş akışı bitiriliyor."
                break
              fi

            fi

            # ======================================================
            # TARAMA
            # ======================================================

            SCAN_START=$(date +%s)

            if [ "$FIRST_RUN" = "true" ]; then

              echo "İLK TARAMA: GÜNLÜK + AYLIK MACD"

              AYLIK_TARAMA=true python main.py

              FIRST_RUN=false

            else

              echo "NORMAL TARAMA: SADECE GÜNLÜK"

              AYLIK_TARAMA=false python main.py

            fi

            SCAN_END=$(date +%s)
            ELAPSED=$((SCAN_END - SCAN_START))

            echo "Tarama süresi: ${ELAPSED} saniye"

            # ======================================================
            # TARAMA SONRASI SAAT KONTROLÜ
            # ======================================================

            HOUR=$(TZ=Europe/Istanbul date +%H)
            MINUTE=$(TZ=Europe/Istanbul date +%M)

            TOTAL_MINUTES=$((10#$HOUR * 60 + 10#$MINUTE))

            if [ "$MODE" = "SABAH" ] && [ "$TOTAL_MINUTES" -ge "$AFTERNOON_START" ]; then
              echo "14:00 oldu. Sabah iş akışı kapatılıyor."
              break
            fi

            if [ "$TOTAL_MINUTES" -ge "$END_TIME" ]; then
              echo "18:05 oldu. İş akışı kapatılıyor."
              break
            fi

            # ======================================================
            # SONRAKİ 5 DAKİKALIK NOKTAYA BEKLE
            # ======================================================

            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            CURRENT_MINUTE_NUM=$((10#$CURRENT_MINUTE))
            CURRENT_SECOND_NUM=$((10#$CURRENT_SECOND))

            REMAINDER=$((CURRENT_MINUTE_NUM % 5))

            if [ "$REMAINDER" -eq 0 ]; then
              MINUTES_TO_WAIT=5
            else
              MINUTES_TO_WAIT=$((5 - REMAINDER))
            fi

            WAIT_SECONDS=$((MINUTES_TO_WAIT * 60 - CURRENT_SECOND_NUM))

            if [ "$WAIT_SECONDS" -le 0 ]; then
              WAIT_SECONDS=5
            fi

            echo "Sonraki 5 dakikalık tarama için ${WAIT_SECONDS} saniye bekleniyor..."

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "========================================"
          echo "TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "========================================"

      # ============================================================
      # GÖNDERİLEN HİSSELERİ KAYDET
      # ============================================================

      - name: Gonderilen hisseleri kaydet
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt || true
          git add gonderilen_aylik_hisseler.txt || true

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Bot gonderim kayıtlarını guncelle"
            git push
          fi
