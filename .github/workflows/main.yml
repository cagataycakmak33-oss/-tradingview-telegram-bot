
name: Ticaret Botu Çalışır

on:
  schedule:
    # Sabah oturumu: Türkiye saatiyle 09:50
    - cron: "50 9 * * 1-5"
      timezone: "Europe/Istanbul"

    # Öğleden sonra oturumu: Türkiye saatiyle 14:00
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki bot oturumu çalışmasın.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "=========================================="

          START_HOUR=$(date +%H)
          START_MINUTE=$(date +%M)
          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))
          DAY_OF_WEEK=$(date +%u)

          echo "Workflow baslangic saati: ${START_HOUR}:${START_MINUTE}"
          echo "Haftanin gunu: ${DAY_OF_WEEK}"
          echo "Tetikleme: ${{ github.event_name }}"
          echo "Tarife: ${{ github.event.schedule }}"

          # Hafta sonu calisma.
          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot calistirilmayacak."
            exit 0
          fi

          # 18:00 son tarama baslangicidir.
          # 18:00 sonrasinda yeni bir tarama baslatma.
          if [ "$START_TOTAL" -gt 1080 ]; then
            echo "Tarama saatleri disinda. Bot kapatiliyor."
            exit 0
          fi

          # Oturum secimi.
          if [ "$START_TOTAL" -lt 840 ]; then
            MODE="morning"
            END_TOTAL=840
            echo "SABAH TARAMA MODU: 09:50 - 14:00"
          else
            MODE="afternoon"
            END_TOTAL=1085
            echo "OGLEDEN SONRA TARAMA MODU: 14:00 - 18:05"
          fi

          while true; do
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$(date +%M)
            NOW_SECOND=$(date +%S)
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + 10#$NOW_MINUTE))

            # Sabah oturumu 14:00'te biter.
            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge 840 ]; then
              echo "14:00 oldu. Sabah oturumu kapatiliyor."
              break
            fi

            # 18:05'te yeni tarama baslatmadan cik.
            if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -ge "$END_TOTAL" ]; then
              echo "18:05 oldu. Ogleden sonra oturumu kapatiliyor."
              break
            fi

            # Sabah workflow'u erken baslarsa 09:50'yi bekle.
            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -lt 590 ]; then
              echo "09:50 bekleniyor..."
              sleep 30
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Tarama baslangici: ${NOW_HOUR}:${NOW_MINUTE}:${NOW_SECOND}"
            echo "=========================================="

            SCAN_START=$(date +%s)
            python main.py
            SCAN_END=$(date +%s)

            echo "Tarama suresi: $((SCAN_END - SCAN_START)) saniye"

            # Tarama sonrasinda seans sinirini kontrol et.
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$(date +%M)
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + 10#$NOW_MINUTE))

            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge 840 ]; then
              echo "Sabah oturumu tamamlandi."
              break
            fi

            if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -ge 1085 ]; then
              echo "18:05 oldu. Ogleden sonra oturumu tamamlandi."
              break
            fi

            # Sonraki 5 dakikalik saat sinirina kadar bekle.
            CURRENT_EPOCH=$(date +%s)
            NEXT_EPOCH=$(( (CURRENT_EPOCH / 300 + 1) * 300 ))
            WAIT_SECONDS=$((NEXT_EPOCH - CURRENT_EPOCH))

            echo "Bir sonraki tarama icin ${WAIT_SECONDS} saniye bekleniyor..."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "TARAMA DONGUSU TAMAMLANDI"
          echo "=========================================="

      - name: Gonderilen hisseleri kaydet
        if: always()
        shell: bash
        run: |
          if [ ! -f gonderilen_hisseler.txt ]; then
            echo "Gonderilen hisse dosyasi bulunamadi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gonderilen_hisseler.txt

          if git diff --cached --quiet; then
            echo "Yeni gonderilen hisse kaydi yok."
          else
            git commit -m "Gunluk gonderilen hisseleri guncelle"
            git push
          fi
