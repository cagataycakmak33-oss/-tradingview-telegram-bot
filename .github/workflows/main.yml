name: Ticaret Botu Çalışır

on:
  schedule:
    # 1. Parça (Sabah Seansı): Hafta içi TSİ 09:50 -> UTC 06:50 yapar
    - cron: "50 6 * * 1-5"

    # 2. Parça (Öğleden Sonra Seansı): Hafta içi TSİ 14:00 -> UTC 11:00 yapar
    - cron: "0 11 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki bot oturumu çalışmasın.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu 5 dakikada bir calistir
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "=========================================="

          # 10# eklenerek 08 ve 09 gibi saatlerin Bash'i çökertmesi kesin olarak engellendi
          START_HOUR=$(date +%H)
          START_MINUTE=$(date +%M)
          START_TOTAL=$((10#$START_HOUR * 60 + 10#$START_MINUTE))
          DAY_OF_WEEK=$(date +%u)

          echo "Workflow baslangic saati: ${START_HOUR}:${START_MINUTE}"
          echo "Haftanin gunu: ${DAY_OF_WEEK}"

          # Hafta sonu çalışmasını engelle (1=Pazartesi, 5=Cuma)
          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot calistirilmayacak."
            exit 0
          fi

          # Akşam 18:00'den sonra yeni bir oturum başlamasın (18 * 60 = 1080)
          if [ "$START_TOTAL" -gt 1080 ]; then
            echo "Tarama saatleri disinda. Bot kapatiliyor."
            exit 0
          fi

          # Tetiklenme saatine göre botun hangi modda çalışacağını seçiyoruz (14:00 = 840 dakika)
          if [ "$START_TOTAL" -lt 840 ]; then
            MODE="morning"
            END_TOTAL=840
            echo "SABAH TARAMA MODU: 09:50 - 14:00"
          else
            MODE="afternoon"
            END_TOTAL=1080
            echo "OGLEDEN SONRA TARAMA MODU: 14:00 - 18:00"
          fi

          while true; do
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$(date +%M)
            NOW_SECOND=$(date +%S)
            # Döngü içindeki bu satıra da çökme koruması (10#) uygulandı
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + 10#$NOW_MINUTE))

            # Sabah oturumu bitiş kontrolü (Saat 14:00 olduysa kapat)
            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge 840 ]; then
              echo "Saat 14:00 oldu. Sabah oturumu kapatiliyor."
              break
            fi

            # Öğleden sonra oturumu bitiş kontrolü (Saat 18:00 olduysa kapat)
            if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -ge 1080 ]; then
              echo "Saat 18:00 oldu. Ogleden sonra oturumu kapatiliyor."
              break
            fi

            # Eğer sabah workflow'u GitHub yoğunluğundan erken başlarsa 09:50'yi bekle
            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -lt 590 ]; then
              echo "09:50 seansı bekleniyor..."
              sleep 30
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Tarama baslangici: ${NOW_HOUR}:${NOW_MINUTE}:${NOW_SECOND}"
            echo "=========================================="

            SCAN_START=$(date +%s)
            python main.py
            SCAN_END=$(date +%s)

            echo "Tarama suresi: $((SCAN_END - SCAN_START)) saniye"

            # Tarama bittikten sonra zamanı anlık olarak yeniden kontrol et
            NOW_HOUR=$(date +%H)
            NOW_MINUTE=$(date +%M)
            NOW_TOTAL=$((10#$NOW_HOUR * 60 + 10#$NOW_MINUTE))

            if [ "$MODE" = "morning" ] && [ "$NOW_TOTAL" -ge 840 ]; then
              echo "Sabah oturumu seans sonunda tamamlandi."
              break
            fi

            if [ "$MODE" = "afternoon" ] && [ "$NOW_TOTAL" -ge 1080 ]; then
              echo "Ogleden sonra oturumu seans sonunda tamamlandi."
              break
            fi

            # Sonraki tam 5. dakikaya kadar hassas bekleme yap (Örn: 10:05, 10:10)
            CURRENT_EPOCH=$(date +%s)
            NEXT_EPOCH=$(( (CURRENT_EPOCH / 300 + 1) * 300 ))
            WAIT_SECONDS=$((NEXT_EPOCH - CURRENT_EPOCH))

            echo "Bir sonraki tarama seansi icin ${WAIT_SECONDS} saniye bekleniyor..."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "OTURUM TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "=========================================="

      - name: Gonderilen hisseleri kaydet
        if: always()
        shell: bash
        run: |
          if [ ! -f gonderilen_hisseler.txt ]; then
            echo "Gonderilen hisse dosyasi bulunamadi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          git add gonderilen_hisseler.txt

          if git diff --cached --quiet; then
            echo "Yeni gonderilen hisse kaydi yok."
          else
            git commit -m "Gunluk gonderilen hisseleri guncelle"
            git push
          fi
