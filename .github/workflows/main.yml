name: Ticaret Botu Calistir

on:
  schedule:
    # Sabah: Türkiye saati 09:55
    - cron: "55 9 * * 1-5"
      timezone: "Europe/Istanbul"

    # Öğleden sonra: Türkiye saati 14:00
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 260

    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ==========================================
      # KODLARI AL
      # ==========================================

      - name: Kodları al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # PAKETLER
      # ==========================================

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # TARAMA DÖNGÜSÜ
      # ==========================================

      - name: Tarama döngüsünü başlat
        shell: bash
        run: |
          set -e

          # ==========================================
          # ZAMAN AYARLARI
          # ==========================================

          MORNING_START=595       # 09:55
          AFTERNOON_START=840     # 14:00
          END_TIME=1080           # 18:00

          INTERVAL=300            # 5 dakika

          # ==========================================
          # TÜRKİYE SAATİ
          # ==========================================

          CURRENT_HOUR=$(TZ=Europe/Istanbul date +%H)
          CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
          CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

          DAY_OF_WEEK=$(TZ=Europe/Istanbul date +%u)

          echo "=============================================="
          echo "       5 DAKİKALIK TİCARET BOTU"
          echo "=============================================="
          echo "Türkiye saati: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M:%S')"
          echo "Haftanın günü: $DAY_OF_WEEK"
          echo "GitHub etkinliği: ${{ github.event_name }}"
          echo "Program: ${{ github.event.schedule }}"
          echo "=============================================="

          # ==========================================
          # HAFTA SONU
          # ==========================================

          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu."
            echo "Bot çalıştırılmayacak."
            exit 0
          fi

          # ==========================================
          # SABAH MODU
          # ==========================================

          if [ "$CURRENT_TOTAL" -ge "$MORNING_START" ] && [ "$CURRENT_TOTAL" -lt "$AFTERNOON_START" ]; then

            MODE="SABAH"

            echo "=============================================="
            echo "        SABAH TARAMA MODU"
            echo "        09:55 - 14:00"
            echo "=============================================="

          # ==========================================
          # ÖĞLEDEN SONRA MODU
          # ==========================================

          elif [ "$CURRENT_TOTAL" -ge "$AFTERNOON_START" ] && [ "$CURRENT_TOTAL" -lt "$END_TIME" ]; then

            MODE="OGLE"

            echo "=============================================="
            echo "     ÖĞLEDEN SONRA TARAMA MODU"
            echo "        14:00 - 18:00"
            echo "=============================================="

          # ==========================================
          # AKTİF SAAT DEĞİL
          # ==========================================

          else

            echo "Şu anda aktif tarama saati değil."
            echo "Türkiye saati: $(TZ=Europe/Istanbul date '+%H:%M:%S')"
            echo "Bot kapatılıyor."
            exit 0

          fi

          # ==========================================
          # TARAMA DÖNGÜSÜ
          # ==========================================

          while true; do

            CURRENT_HOUR=$(TZ=Europe/Istanbul date +%H)
            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            CURRENT_TOTAL=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))

            echo ""
            echo "=============================================="
            echo "Türkiye saati: ${CURRENT_HOUR}:${CURRENT_MINUTE}:${CURRENT_SECOND}"
            echo "Mod: $MODE"
            echo "=============================================="

            # ==========================================
            # SABAH BİTİŞ KONTROLÜ
            # ==========================================

            if [ "$MODE" = "SABAH" ]; then

              if [ "$CURRENT_TOTAL" -ge "$AFTERNOON_START" ]; then
                echo "14:00 oldu."
                echo "Sabah tarama döngüsü tamamlandı."
                break
              fi

            fi

            # ==========================================
            # ÖĞLEDEN SONRA BİTİŞ KONTROLÜ
            # ==========================================

            if [ "$MODE" = "OGLE" ]; then

              if [ "$CURRENT_TOTAL" -ge "$END_TIME" ]; then
                echo "18:00 oldu."
                echo "Öğleden sonra tarama döngüsü tamamlandı."
                break
              fi

            fi

            # ==========================================
            # TARAMA
            # ==========================================

            echo ""
            echo ">>> YENİ TARAMA BAŞLIYOR"
            echo ">>> $(TZ=Europe/Istanbul date '+%H:%M:%S')"
            echo ""

            python main.py

            echo ""
            echo ">>> TARAMA TAMAMLANDI"
            echo ">>> $(TZ=Europe/Istanbul date '+%H:%M:%S')"
            echo ""

            # ==========================================
            # SONRAKİ 5 DAKİKALIK ZAMANI HESAPLA
            # ==========================================

            CURRENT_MINUTE=$(TZ=Europe/Istanbul date +%M)
            CURRENT_SECOND=$(TZ=Europe/Istanbul date +%S)

            MINUTE=$((10#$CURRENT_MINUTE))
            SECOND=$((10#$CURRENT_SECOND))

            REMAINDER=$((MINUTE % 5))

            if [ "$REMAINDER" -eq 0 ]; then
              WAIT_MINUTES=5
            else
              WAIT_MINUTES=$((5 - REMAINDER))
            fi

            WAIT_SECONDS=$((WAIT_MINUTES * 60 - SECOND))

            if [ "$WAIT_SECONDS" -lt 1 ]; then
              WAIT_SECONDS=1
            fi

            echo "Sonraki tarama yaklaşık $WAIT_SECONDS saniye sonra."
            echo ""

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "=============================================="
          echo "       TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "=============================================="
