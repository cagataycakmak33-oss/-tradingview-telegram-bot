name: Ticaret Botu Çalışır

on:
  schedule:
    # Türkiye saati 09:55
    - cron: "55 6 * * 1-5"

    # Türkiye saati 14:00
    - cron: "0 11 * * 1-5"

  workflow_dispatch:
    inputs:
      session_mode:
        description: "Çalıştırılacak seans"
        required: true
        type: choice
        options:
          - morning
          - afternoon
        default: morning

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  ticaret-botu:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
      MANUAL_MODE: ${{ inputs.session_mode }}

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "HATA: requirements.txt bulunamadı."
            exit 1
          fi

      - name: Seans boyunca 5 dakikada bir tarama yap
        shell: bash
        run: |
          set -uo pipefail
          export TZ="Europe/Istanbul"

          MORNING_START=595
          MORNING_END=840
          AFTERNOON_START=840
          AFTERNOON_END=1080
          INTERVAL=300
          FAILED_SCANS=0

          get_minute_of_day() {
            local hour minute
            hour=$(date +%H)
            minute=$(date +%M)
            echo $((10#$hour * 60 + 10#$minute))
          }

          echo "=========================================="
          echo "5 DAKIKALIK TICARET BOTU BASLIYOR"
          echo "Türkiye saati: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Tetikleme: ${EVENT_NAME}"
          echo "Cron: ${SCHEDULE_CRON:-manuel}"
          echo "=========================================="

          DAY_OF_WEEK=$(date +%u)

          if [ "$DAY_OF_WEEK" -gt 5 ]; then
            echo "Hafta sonu. Bot çalıştırılmayacak."
            exit 0
          fi

          # Seansı cron tetiklemesine göre belirle.
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "55 6 * * 1-5")
                MODE="morning"
                ;;
              "0 11 * * 1-5")
                MODE="afternoon"
                ;;
              *)
                echo "Tanınmayan cron tetiklemesi: $SCHEDULE_CRON"
                exit 1
                ;;
            esac
          else
            MODE="${MANUAL_MODE:-morning}"
          fi

          case "$MODE" in
            morning)
              START_TOTAL=$MORNING_START
              END_TOTAL=$MORNING_END
              echo "SABAH TARAMA MODU"
              echo "09:55 - 14:00"
              ;;
            afternoon)
              START_TOTAL=$AFTERNOON_START
              END_TOTAL=$AFTERNOON_END
              echo "ÖĞLEDEN SONRA TARAMA MODU"
              echo "14:00 - 18:00"
              ;;
            *)
              echo "HATA: Tanınmayan seans: $MODE"
              exit 1
              ;;
          esac

          # Seans başlangıcından önce tetiklenirse bekle.
          while true; do
            NOW=$(get_minute_of_day)

            if [ "$NOW" -ge "$END_TOTAL" ]; then
              echo "Seans bitiş saati geçmiş. Workflow kapatılıyor."
              exit 0
            fi

            if [ "$NOW" -ge "$START_TOTAL" ]; then
              break
            fi

            echo "Seans başlangıcı bekleniyor..."
            echo "Türkiye saati: $(date '+%H:%M:%S')"
            sleep 30
          done

          echo "İlk tarama: $(date '+%Y-%m-%d %H:%M:%S')"

          # Seans boyunca tarama döngüsü.
          while true; do
            NOW=$(get_minute_of_day)

            if [ "$NOW" -ge "$END_TOTAL" ]; then
              echo "Seans bitiş saatine ulaşıldı."
              break
            fi

            echo "------------------------------------------"
            echo "Tarama başlıyor: $(date '+%Y-%m-%d %H:%M:%S')"

            if python -u main.py; then
              echo "Tarama başarıyla tamamlandı."
            else
              SCAN_EXIT=$?
              FAILED_SCANS=$((FAILED_SCANS + 1))
              echo "UYARI: Tarama başarısız. Kod: $SCAN_EXIT"
              echo "Başarısız tarama sayısı: $FAILED_SCANS"
            fi

            NOW=$(get_minute_of_day)

            if [ "$NOW" -ge "$END_TOTAL" ]; then
              echo "Seans bitti. Yeni tarama yapılmayacak."
              break
            fi

            # Sonraki 5 dakikalık zaman dilimine kadar bekle.
            CURRENT_EPOCH=$(date +%s)
            WAIT_SECONDS=$((INTERVAL - CURRENT_EPOCH % INTERVAL))

            echo "Bir sonraki tarama için ${WAIT_SECONDS} saniye bekleniyor."
            sleep "$WAIT_SECONDS"
          done

          echo "=========================================="
          echo "TARAMA DÖNGÜSÜ TAMAMLANDI"
          echo "Seans: $MODE"
          echo "Başarısız tarama sayısı: $FAILED_SCANS"
          echo "Bitiş: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

      - name: Hisse kayıtlarını kaydet
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f gonderilen_hisseler.txt 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Hisse gönderim kayıtlarını güncelle"
            git push
          else
            echo "Kaydedilecek yeni hisse kaydı yok."
          fi
