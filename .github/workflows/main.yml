name: Trading Bot Calistir

on:
  schedule:
    - cron: "50,55 9 * * 1-5"
      timezone: "Europe/Istanbul"

    - cron: "*/5 10-17 * * 1-5"
      timezone: "Europe/Istanbul"

    - cron: "0,5 18 * * 1-5"
      timezone: "Europe/Istanbul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yukle
        run: |
          pip install -r requirements.txt

      - name: Botu calistir
        run: |
          python main.py

      - name: Gonderilen hisseleri kaydet
        run: |
          if [ -f gonderilen_hisseler.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gonderilen_hisseler.txt

            if git diff --cached --quiet; then
              echo "Yeni gönderilen hisse yok."
            else
              git commit -m "Günlük gönderilen hisseleri güncelle"
              git push
            fi
          else
            echo "gonderilen_hisseler.txt bulunamadı."
          fi
